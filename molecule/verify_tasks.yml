---
# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: forgejo_defaults

- name: Wait for the Forgejo systemd service to become active (up to 180s)
  ansible.builtin.systemd_service:
    name: forgejo.service
  register: forgejo_service
  until: forgejo_service.status.ActiveState == 'active'
  retries: 36
  delay: 5
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# `Restart=always` in the systemd unit means that even a container which crashes
# and gets restarted reads as active here, so this is a precondition rather than
# a result.
- name: Assert the Forgejo systemd service is active
  ansible.builtin.assert:
    that: forgejo_service.status.ActiveState == 'active'
    fail_msg: "forgejo.service is not active ({{ forgejo_service.status.ActiveState }})"
    success_msg: "forgejo.service is active"

- name: Retrieve the Forgejo systemd service log for debugging
  when: forgejo_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl --no-pager --output=cat --unit=forgejo.service
  changed_when: false

# An unconfigured Forgejo serves nothing but its installation wizard: every
# path renders the install form and the API is not routed at all. This
# endpoint answering with 200 is therefore what tells an installed Forgejo
# apart from a merely running binary.
- name: Wait for the Forgejo API to report its version (up to 10m)
  ansible.builtin.uri:
    url: "http://localhost:3000/api/v1/version"
    method: GET
    return_content: true
  register: forgejo_api_version
  until: forgejo_api_version.status == 200
  retries: 120
  delay: 5

# The reported version carries an upstream suffix (`16.0.3+gitea-1.22.0`).
- name: Assert the running Forgejo is the version this role installs
  ansible.builtin.assert:
    that: forgejo_api_version.json.version.split('+') | first == forgejo_defaults.forgejo_version
    fail_msg: "Forgejo reports {{ forgejo_api_version.json.version }}, expected {{ forgejo_defaults.forgejo_version }}"
    success_msg: "Forgejo reports {{ forgejo_api_version.json.version }}"

# Forgejo pings its data-stores on demand here, so this exercises the
# database and the cache adapter that the scenario wired up, rather than
# just the fact that the container came up.
- name: Query the Forgejo health endpoint
  ansible.builtin.uri:
    url: "http://localhost:3000/api/healthz"
    method: GET
    return_content: true
  register: forgejo_healthz

- name: Assert Forgejo reports itself and its data-stores as healthy
  ansible.builtin.assert:
    that:
      - forgejo_healthz.json.status == 'pass'
      - forgejo_healthz.json.checks['database:ping'] | map(attribute='status') | unique | list == ['pass']
      - forgejo_healthz.json.checks['cache:ping'] | map(attribute='status') | unique | list == ['pass']
    fail_msg: "Forgejo is not healthy: {{ forgejo_healthz.json }}"
    success_msg: "Forgejo, its database and its cache are healthy"

- name: Retrieve the Forgejo web interface
  ansible.builtin.uri:
    url: "http://localhost:3000/"
    method: GET
    status_code: [200]
    return_content: true
  register: forgejo_endpoint

- name: Assert the Forgejo web interface is served
  ansible.builtin.assert:
    that: "'Forgejo' in forgejo_endpoint.content"
    fail_msg: "The Forgejo web interface did not render as expected"
    success_msg: "The Forgejo web interface is served"

- name: Show the Forgejo verification summary
  ansible.builtin.debug:
    msg:
      - "Forgejo systemd: {{ forgejo_service.status.ActiveState }}"
      - "Forgejo version: {{ forgejo_api_version.json.version }}"
      - "Forgejo health: {{ forgejo_healthz.json.checks }}"
      - "Forgejo web interface: {{ forgejo_endpoint.status }}"
